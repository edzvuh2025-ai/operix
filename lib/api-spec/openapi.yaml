openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Operix API - The Operating System for Roblox Groups
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: groups
    description: Roblox group management
  - name: staff
    description: Staff member management
  - name: sessions
    description: In-game session tracking
  - name: cases
    description: Case & evidence management
  - name: automation
    description: Automation rules engine
  - name: ai
    description: AI intelligence layer
  - name: dashboard
    description: Dashboard aggregations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Groups ───────────────────────────────────────────────────────────
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups for authenticated user
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group by ID
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update group settings
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupBody"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Staff ─────────────────────────────────────────────────────────────
  /groups/{groupId}/staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff members for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, flagged]
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaffMember
      tags: [staff]
      summary: Add a staff member
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffMemberBody"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /groups/{groupId}/staff/{staffId}:
    get:
      operationId: getStaffMember
      tags: [staff]
      summary: Get a staff member profile
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberDetail"
    patch:
      operationId: updateStaffMember
      tags: [staff]
      summary: Update a staff member
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffMemberBody"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: deleteStaffMember
      tags: [staff]
      summary: Remove a staff member
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Sessions ──────────────────────────────────────────────────────────
  /groups/{groupId}/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Start a new session (called from in-game)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /groups/{groupId}/sessions/{sessionId}/end:
    post:
      operationId: endSession
      tags: [sessions]
      summary: End an active session
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  # ── Cases ─────────────────────────────────────────────────────────────
  /groups/{groupId}/cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [open, under_review, closed, appealed]
        - name: staffId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Cases list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseBody"
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /groups/{groupId}/cases/{caseId}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get case details
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: caseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update case status or details
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: caseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseBody"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /groups/{groupId}/cases/{caseId}/evidence:
    post:
      operationId: addCaseEvidence
      tags: [cases]
      summary: Add evidence to a case
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: caseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEvidenceBody"
      responses:
        "201":
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"

  # ── Automation ────────────────────────────────────────────────────────
  /groups/{groupId}/automation:
    get:
      operationId: listAutomationRules
      tags: [automation]
      summary: List automation rules for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Automation rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRule"
    post:
      operationId: createAutomationRule
      tags: [automation]
      summary: Create an automation rule
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationRuleBody"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"

  /groups/{groupId}/automation/{ruleId}:
    patch:
      operationId: updateAutomationRule
      tags: [automation]
      summary: Update an automation rule
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
    delete:
      operationId: deleteAutomationRule
      tags: [automation]
      summary: Delete an automation rule
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── AI Insights ───────────────────────────────────────────────────────
  /groups/{groupId}/ai/insights:
    get:
      operationId: getAiInsights
      tags: [ai]
      summary: Get AI-generated insights for group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiInsight"

  /groups/{groupId}/staff/{staffId}/ai/summary:
    post:
      operationId: generateStaffSummary
      tags: [ai]
      summary: Generate AI performance summary for a staff member
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStaffSummary"

  /groups/{groupId}/cases/{caseId}/ai/summarize:
    post:
      operationId: summarizeCase
      tags: [ai]
      summary: Generate AI summary of a case
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: caseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCaseSummary"

  # ── Dashboard ─────────────────────────────────────────────────────────
  /groups/{groupId}/dashboard:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get aggregated dashboard stats
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /groups/{groupId}/activity:
    get:
      operationId: getActivityFeed
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /groups/{groupId}/alerts:
    get:
      operationId: listAlerts
      tags: [dashboard]
      summary: List live alerts for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /groups/{groupId}/alerts/{alertId}/read:
    post:
      operationId: markAlertRead
      tags: [dashboard]
      summary: Mark an alert as read
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Groups ──────────────────────────────────────────────────────────
    Group:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        name:
          type: string
        robloxGroupId:
          type: string
        description:
          type: string
        logoUrl:
          type: string
        staffCount:
          type: integer
        activeSessions:
          type: integer
        openCases:
          type: integer
        createdAt:
          type: string
      required: [id, clerkUserId, name, createdAt]

    CreateGroupBody:
      type: object
      properties:
        name:
          type: string
        robloxGroupId:
          type: string
        description:
          type: string
        logoUrl:
          type: string
      required: [name]

    UpdateGroupBody:
      type: object
      properties:
        name:
          type: string
        robloxGroupId:
          type: string
        description:
          type: string
        logoUrl:
          type: string

    # ── Staff ────────────────────────────────────────────────────────────
    StaffMember:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        robloxUsername:
          type: string
        robloxId:
          type: string
        rank:
          type: string
        role:
          type: string
          enum: [admin, hr, moderator, staff]
        status:
          type: string
          enum: [active, inactive, flagged, suspended]
        totalActivityMinutes:
          type: integer
        sessionsCount:
          type: integer
        warningsCount:
          type: integer
        casesCount:
          type: integer
        lastSeenAt:
          type: string
        joinedAt:
          type: string
        avatarUrl:
          type: string
      required: [id, groupId, robloxUsername, role, status, totalActivityMinutes, sessionsCount, warningsCount, casesCount, joinedAt]

    StaffMemberDetail:
      allOf:
        - $ref: "#/components/schemas/StaffMember"
        - type: object
          properties:
            recentSessions:
              type: array
              items:
                $ref: "#/components/schemas/Session"
            recentCases:
              type: array
              items:
                $ref: "#/components/schemas/Case"
            aiInsight:
              type: string
          required: [recentSessions, recentCases]

    CreateStaffMemberBody:
      type: object
      properties:
        robloxUsername:
          type: string
        robloxId:
          type: string
        rank:
          type: string
        role:
          type: string
          enum: [admin, hr, moderator, staff]
      required: [robloxUsername, role]

    UpdateStaffMemberBody:
      type: object
      properties:
        rank:
          type: string
        role:
          type: string
          enum: [admin, hr, moderator, staff]
        status:
          type: string
          enum: [active, inactive, flagged, suspended]

    # ── Sessions ─────────────────────────────────────────────────────────
    Session:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        staffId:
          type: integer
        staffUsername:
          type: string
        serverName:
          type: string
        startedAt:
          type: string
        endedAt:
          type: string
        durationMinutes:
          type: integer
        active:
          type: boolean
        actionsCount:
          type: integer
      required: [id, groupId, staffId, startedAt, active]

    CreateSessionBody:
      type: object
      properties:
        staffId:
          type: integer
        robloxUsername:
          type: string
        serverName:
          type: string
      required: [robloxUsername]

    # ── Cases ─────────────────────────────────────────────────────────────
    Case:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        staffId:
          type: integer
        staffUsername:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, under_review, closed, appealed]
        autoGenerated:
          type: boolean
        aiSummary:
          type: string
        suggestedAction:
          type: string
        evidenceCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, groupId, title, severity, status, autoGenerated, createdAt]

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          properties:
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
          required: [evidence]

    CreateCaseBody:
      type: object
      properties:
        staffId:
          type: integer
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
      required: [title, severity]

    UpdateCaseBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, under_review, closed, appealed]

    Evidence:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        type:
          type: string
          enum: [text, image, log, timestamp]
        content:
          type: string
        imageUrl:
          type: string
        addedAt:
          type: string
      required: [id, caseId, type, content, addedAt]

    AddEvidenceBody:
      type: object
      properties:
        type:
          type: string
          enum: [text, image, log, timestamp]
        content:
          type: string
        imageUrl:
          type: string
      required: [type, content]

    # ── Automation ────────────────────────────────────────────────────────
    AutomationRule:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        name:
          type: string
        enabled:
          type: boolean
        trigger:
          type: string
          enum: [session_duration, inactivity_days, case_count, punishment_count]
        triggerValue:
          type: number
        action:
          type: string
          enum: [flag_staff, create_case, notify, promote, demote]
        actionDetails:
          type: string
        firedCount:
          type: integer
        createdAt:
          type: string
      required: [id, groupId, name, enabled, trigger, triggerValue, action, createdAt]

    CreateAutomationRuleBody:
      type: object
      properties:
        name:
          type: string
        trigger:
          type: string
          enum: [session_duration, inactivity_days, case_count, punishment_count]
        triggerValue:
          type: number
        action:
          type: string
          enum: [flag_staff, create_case, notify, promote, demote]
        actionDetails:
          type: string
      required: [name, trigger, triggerValue, action]

    UpdateAutomationRuleBody:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        trigger:
          type: string
          enum: [session_duration, inactivity_days, case_count, punishment_count]
        triggerValue:
          type: number
        action:
          type: string
          enum: [flag_staff, create_case, notify, promote, demote]
        actionDetails:
          type: string

    # ── AI ────────────────────────────────────────────────────────────────
    AiInsight:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        staffId:
          type: integer
        staffUsername:
          type: string
        type:
          type: string
          enum: [inactivity, high_performance, anomaly, promotion_suggest, demotion_suggest, case_auto]
        message:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        resolved:
          type: boolean
        createdAt:
          type: string
      required: [id, groupId, type, message, severity, resolved, createdAt]

    AiStaffSummary:
      type: object
      properties:
        staffId:
          type: integer
        summary:
          type: string
        recommendation:
          type: string
        performanceScore:
          type: integer
        highlights:
          type: array
          items:
            type: string
      required: [staffId, summary, recommendation, performanceScore, highlights]

    AiCaseSummary:
      type: object
      properties:
        caseId:
          type: integer
        summary:
          type: string
        suggestedAction:
          type: string
        severity:
          type: string
      required: [caseId, summary, suggestedAction]

    # ── Dashboard ─────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      properties:
        totalStaff:
          type: integer
        activeStaff:
          type: integer
        inactiveStaff:
          type: integer
        flaggedStaff:
          type: integer
        activeSessions:
          type: integer
        totalSessionsToday:
          type: integer
        totalActivityMinutesToday:
          type: integer
        openCases:
          type: integer
        closedCasesThisWeek:
          type: integer
        pendingAlerts:
          type: integer
        automationRulesFired:
          type: integer
        topPerformers:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
        recentInsights:
          type: array
          items:
            $ref: "#/components/schemas/AiInsight"
      required: [totalStaff, activeStaff, inactiveStaff, flaggedStaff, activeSessions, totalSessionsToday, totalActivityMinutesToday, openCases, closedCasesThisWeek, pendingAlerts, automationRulesFired, topPerformers, recentInsights]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        type:
          type: string
          enum: [session_start, session_end, case_created, case_closed, staff_flagged, alert_fired, staff_added]
        message:
          type: string
        staffUsername:
          type: string
        referenceId:
          type: integer
        createdAt:
          type: string
      required: [id, groupId, type, message, createdAt]

    Alert:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        type:
          type: string
          enum: [inactivity, abuse_detected, case_update, promotion_suggestion, session_anomaly]
        message:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        staffId:
          type: integer
        staffUsername:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
      required: [id, groupId, type, message, severity, read, createdAt]
