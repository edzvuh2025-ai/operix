lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    devDependencies:
      typescript:
        specifier: ^5.3.3
        version: 5.3.3

  artifacts/api-server:
    dependencies:
      '@clerk/express':
        specifier: ^1.0.0
        version: 1.0.0
      '@operix/api-zod':
        specifier: workspace:*
        version: link:../../lib/api-zod
      '@operix/db':
        specifier: workspace:*
        version: link:../../lib/db
      cors:
        specifier: ^2.8.5
        version: 2.8.5
      dotenv:
        specifier: ^16.3.1
        version: 16.3.1
      express:
        specifier: ^4.18.2
        version: 4.18.2
    devDependencies:
      '@types/cors':
        specifier: ^2.8.17
        version: 2.8.17
      '@types/express':
        specifier: ^4.17.21
        version: 4.17.21
      '@types/node':
        specifier: ^20.10.6
        version: 20.10.6
      typescript:
        specifier: ^5.3.3
        version: 5.3.3

  artifacts/operix:
    dependencies:
      '@clerk/clerk-react':
        specifier: ^4.30.0
        version: 4.30.0
      react:
        specifier: ^18.2.0
        version: 18.2.0
      react-dom:
        specifier: ^18.2.0
        version: 18.2.0
      react-router-dom:
        specifier: ^6.20.1
        version: 6.20.1
    devDependencies:
      '@types/react':
        specifier: ^18.2.43
        version: 18.2.43
      '@types/react-dom':
        specifier: ^18.2.17
        version: 18.2.17
      '@vitejs/plugin-react':
        specifier: ^4.2.1
        version: 4.2.1
      autoprefixer:
        specifier: ^10.4.16
        version: 10.4.16
      postcss:
        specifier: ^8.4.32
        version: 8.4.32
      tailwindcss:
        specifier: ^3.4.0
        version: 3.4.0
      typescript:
        specifier: ^5.3.3
        version: 5.3.3
      vite:
        specifier: ^5.0.8
        version: 5.0.8

  lib/api-zod:
    dependencies:
      zod:
        specifier: ^3.22.4
        version: 3.22.4
    devDependencies:
      typescript:
        specifier: ^5.3.3
        version: 5.3.3

  lib/db:
    dependencies:
      drizzle-orm:
        specifier: ^0.29.1
        version: 0.29.1
      pg:
        specifier: ^8.11.3
        version: 8.11.3
    devDependencies:
      drizzle-kit:
        specifier: ^0.20.13
        version: 0.20.13
      typescript:
        specifier: ^5.3.3
        version: 5.3.3
      '@types/node':
        specifier: ^20.10.6
        version: 20.10.6
